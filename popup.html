<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="popup.css" />
  <title>QuickLogin</title>
</head>
<body>
  <header class="header">
    <img src="icons/icon48.png" alt="QuickLogin logo" class="logo" />
    <div class="header-text">
      <h1>QuickLogin</h1>
      <p class="subtitle">Automatic login assistant</p>
    </div>
  </header>

  <main>
    <section class="card">
      <p class="label">Current website</p>
      <p id="current-site" class="site">Checking...</p>
    </section>

    <button id="auto-login" class="primary" disabled title="This button will work in Stage 6">Auto Login</button>
    <p class="hint">
      Stage 1: installation test. The Auto Login button will start
      working after we add password storage (Stage 3) and
      automatic form filling (Stages 5-6).
    </p>
  </main>

  <footer class="footer">
    <span>v1.0.1</span>
    <span id="status" class="status-ok">Installed OK</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
